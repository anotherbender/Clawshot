# Song get effects: what a song shows when found in a chest, at a gift or on the floor (plans/song-get-effects.md,
# "Final visuals"). Read by clawshot.patch.songs.
#
# Non-warp songs show the Fairy Ocarina with their own lesson effect; warp songs show the Ocarina of Time with the
# player's sword-charge effect split into sparks, aura and light (static: Clawshot_ChargeSpark, _ChargeAura,
# _ChargeLight), 4 sparks and 4 aura copies on a ring around the ocarina's vertical axis (0, 90, 180, 270 degrees)
# and one light in the centre, spraying up (rotation_x is in radians). Colours are R, G, B multipliers on the
# effect's own colours. "floor" is the floor pickup (ELink call Wait), "get_pose" Link's get pose (GetDemo).
source = "BBender, confirmed in game 2026-11-23, runs SONGS and SONGS3 (plans/song-get-effects.md, decisions E4-E7; values as built in the gallery, warp_sparks.json), get-pose light at 0.3 after run SONGQA1 (E8)"

# Condition-table offsets of the warp children in .110 (plans/song-get-effects.md, "The effect table"): floor is a
# constant true (from Obj_Rupee_Red's Wait container), get_pose tests UICaptureScene (from Item_FairyBless_MP).
[conditions]
floor = 0xF20
get_pose = 0x4FC0

# Non-warp songs (E5, E6): the song's own effect at scale 0.3 on Wait and GetDemo; GetDemo also on bone Root at
# PositionY 0 (upright and centred in the get pose).
[songs.Item_Melody_ZeldaLullaby]
kind = "non_warp"
effect = "Ply_Ocarina_Correct_ZeldaLullaby_00"
scale = 0.3

