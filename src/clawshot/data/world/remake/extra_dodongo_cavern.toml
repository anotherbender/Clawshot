# Round 5 chest identities and conservative route exclusions (cs5c). Dodongo's Cavern: nine census chests, five
# N64 checks (Map, Compass, Bomb Bag, End of Bridge = 7524527082521156886, Bomb Flower Platform =
# 11582649900854566065; the Boss Room Chest is n64_only) and the four remake-only chests below. Placement data:
# DodongoCavern_Static/_Dynamic (E:/OOTRemake/work/r4-logic-child/dc_actors.txt); guide: IGN, "Dodongo Cavern
# Dungeon Walkthrough" (Switch 2), https://www.ign.com/wikis/ocarina-of-time-remake/Dodongo_Cavern_Dungeon_Walkthrough
#
# Room 5 is the lower-Lizalfos reward, not the Bomb Flower platform: its old item-based census link is corrected.

[locations."Dodongo Cavern Room 1 Chest (TBox_Rupee_Blue)"]
new = true
region = "Dodongos Cavern Lobby"
type = "Chest"
vanilla = "Rupees (5)"
rule = "can_blast_or_smash or Progressive_Strength_Upgrade"
source = "Census 8607798771661947511, west lobby alcove behind a cracked wall, with a nearby Bomb Flower. Explosives or the Bracelet's flower route. https://www.ign.com/wikis/ocarina-of-time-remake/Dodongo_Cavern_Dungeon_Walkthrough. Round 21 cs21e (plans/rounds/r21-hammer.md, class cracked wall): the wall is WallCrack 14106977092420306644 (7.4 from the chest), whose CrackStoneObject damage table takes Hammer 100 (= Bomb 100, MaxLife 6); Kareem broke the same WallCrack actor on Death Mountain Trail with the Hammer (0.2.5)."

[locations."Dodongo Cavern Room 5 Chest (TBox_Rupee_Red)"]
new = true
region = "Dodongos Cavern Lower Right Side"
type = "Chest"
vanilla = "Rupees (20)"
# Round 19 Master Sword shuffle (remake/master_sword.toml header): adult_sword for the implicit adult sword, child
# weapons the child's; it folds to the rule before while shuffle_master_sword is false. Round 21 cs21e: adult_weapon
