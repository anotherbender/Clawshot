rule = "adult_weapon or (is_child and (Sticks or Slingshot or Kokiri_Sword)) or Bombs"
source = "Census 7764016096998075927, lower-Lizalfos arena room 5; appear-chest event DodongoCavern_Gimmick_DefeatLizalfos01. Inherited normal Lizalfos fight rule (Dodongos Cavern.json:55). https://www.ign.com/wikis/ocarina-of-time-remake/Dodongo_Cavern_Dungeon_Walkthrough."

