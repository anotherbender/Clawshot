# Round 21 (cs21d): pot-only Deku Stick and Deku Nut sources leave logic. Remake build e0f3ccfa.
# Kareem, 2026-11-22, in game: Goron City's stick pot exists and drops one Deku Stick, farmable only by leaving and
# re-entering; decision: remove pot-only stick sources from logic. The same holds for OoT Randomizer's "Nut Pot"
# events: no placement in the remake names a fixed nut there.
# Dump facts (every non-DreamWorld Banc file; pots are Obj_Pot_A_*, ResetType 88: they return on every visit):
# - A pot's Banc Dynamic names its drop: Drop__DropActor (a fixed pickup) or Drop__DropTable (one of the tables in
#   the pot's actor pack). No pot names Obj_DekuNut or DropTable_Obj_DekuNut anywhere in the game.
# - A pot with neither uses DropTable_ResourceSupply_00: heart, magic, range weapon, nut and bomb types at weight 20
#   each and the stick type at 0, after GameParameter/DropGlobalParam's DropUnlockCondition (nuts after
#   Get_StoneOfForest_IsAfter_GoInside_Exp, sticks only while Sequence_IsChildhood) and ReplaceSetting (a green
#   rupee instead). A chance per visit, not a source.
# Deku Baba sources (KF Outside Deku Tree, Deku Tree Lobby, Forest Temple NW/NE Outdoors) need a weapon and stay, as
# remake/master_sword.toml has them. Per-event evidence: plans/rounds/r21-sticks.md.

