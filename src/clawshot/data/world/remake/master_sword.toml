# Round 19 Master Sword shuffle (cs19c; plans/rounds/r18-master-sword-design.md sections 7-9; clawshot.generate.swords).
# OoT Randomizer's adult always holds the Master Sword, so its rules read is_adult for an armed adult. Each entry
# here reads adult_sword (world.toml helper) instead, wherever an adult fights, cuts or strikes:
# - adult_sword is is_adult while the world's logic setting shuffle_master_sword is false. That constant folds every
#   entry, and the entries listed below in other files, to its translated rule for each age that reaches it: off,
#   the logic, pool and output are unchanged (tests/test_master_sword_logic.py compares each against its `was`).
# - On, an adult needs an owned durable blade: the Master Sword or Biggoron Sword (the Giant's Knife breaks; logic never
#   counts it, conservatively, though the runtime keeps an owned knife usable). The child-only weapons an
#   `is_adult or ...` rule lists (Kokiri Sword: IsUsableChild only; sticks, slingshot, boomerang, Deku Shield:
#   OoT Randomizer's _is_child_item) are gated to the child, so they never arm a swordless adult; the any-age
#   alternatives a rule names (explosives, Din's Fire, nuts, the Megaton Hammer) stay usable without a sword.
# - Compounded adult branches gate only the sword's assists, never the kill weapons they name (can_kill_biri).
# - Where OoT Randomizer's rule is True in an adult-only room whose native reward follows a fight, the matching
#   can_kill_* helper (LogicHelpers.json) or adult_sword is required; the sources mark the conservative ones.
# - Noncombat is_adult (travel, heights, adult-only places, trades) is unchanged, as are rules that already need a
#   killing item (Volvagia's Hammer; the Flare Dancer chest's room needs the Hammer). Trick and glitch rules stay as
#   translated: they never compile while tricks are off (AGENTS.md rule 6), and enabling one needs this review.
# - Ganondorf's room and the Triforce need the Master Sword itself (section 9.4).
# Entries owned by other override files carry the same rewrite there (rule only, `was` kept): adult_forest_temple
# (Forest Temple Lobby -> Central Area), adult_gerudo_training_ground (Lobby -> Lava Room Front), adult_lake_hylia
# (Ice Cavern End Chest Access), adult_water_temple (Falling Platform Room -> Dark Link Region), child_deku_tree
# (Top Floor -> Basement, Deku Tree GS Compass Room), child_dodongos_cavern (Upper Lizalfos -> Bomb Bag Ledge),
# child_kakariko (Kak Redead Grotto Chest), extra_dodongo_cavern (Room 5 and Room 16 chests), song_lessons (Sheik in
# Ice Cavern, Song from Royal Familys Tomb), token_routes (HF GS Lone Tree), remake.toml (Spirit Temple Mirror Shield
# Chest).
# Not changed, by review: SFM Entryway -> Sacred Forest Meadow (the Wolfos ambush is the child's; the adult maze's
# Moblins need no fight), Graveyard Shield Grave Chest (its ReDead is Graveyard_Child_Dynamic's; child_graveyard keeps
# the adult's translated True), KF Storms Grotto Chest (the scrub trio is beaten with a shield), the octorok helpers (a
# reflected rock), the DMT Gold Skulltulas above Dodongo's Cavern (the Megaton Hammer they need also kills).
# Additional native enemy-counter/chest bindings were audited by cs19c (r19-sword.md). Ungated map/glass chests
# do not acquire an invented combat rule merely because their N64 name mentions an enemy.

# Helpers (OoT Randomizer LogicHelpers.json).

