# Round 21 cs21e (plans/rounds/r21-hammer.md): the Megaton Hammer breaks what bombs break, class by class.
# Kareem, 0.2.5 in game (2026-11-22): the Hammer broke boulders, bomb grottos, the Death Mountain Trail chest's wall
# and the Skulltula wall near Kakariko (both generic WallCrack actors, 12869454506934697528 and 1600448280623797586).
# Data (build e0f3ccfa, Pack/Actor/<actor>.pack.zs): every cracked wall, cracked floor and boulder actor inherits
# WallCrack and carries Life/DamageParameters/CrackStoneObject, whose DamageRates give Hammer (murmur3 'Hammer' =
# 85358548) 100.0, the same as Bomb (3237216321), against MaxLife 6; the Hammer's own pack names that enum
# (Weapon_Hammer EquipmentType 85358548). A wall's death removes it (DeathParam CrackObjectCommon), so the way opens.
# Each entry below names the actor that its explosives open; translated rules widen here, rules another override file
# owns widen in that file. has_explosives becomes can_blast_or_smash (OoT Randomizer's explosives-or-Hammer helper).
# Not here: King Dodongo (Kareem: bombs or Bomb Flowers with the Bracelet), anything the data says the Hammer cannot
# damage (spider webs, Shadow Temple skull pots, icicles, Bottom of the Well candlesticks, beehives: Hammer 0.0), and
# explosives whose target is not one of these actors (eye switches, Bomb Flower chains, the Beamos).

[locations."DMC Gossip Stone"]
