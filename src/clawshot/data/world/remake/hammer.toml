was = "has_explosives"
source = "Round 21 cs21e (r21-hammer.md, class cracked wall): the stone (Obj_GossipStone_A_01 14925975245241235059 at (43.6,132.3,37.3)) sits inside WallCrack 18030667990041421780 at (42.9,131.7,37.0), Banc/DeathMountainCrater_{Child,Adult}_Static; WallCrack's CrackStoneObject damage table takes Hammer 100 (= Bomb 100), the actor Kareem broke on Death Mountain Trail with the Hammer (0.2.5)."

