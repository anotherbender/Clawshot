# Round 18 interim song-lesson rule (Kareem via Main, 2026-11-18): every Dm_MelodyGet_* lesson needs an
# age-usable Ocarina: the Fairy Ocarina as child only, the Ocarina of Time at both ages (age_ocarina.toml).
# Native (build e0f3ccfa, read-only trace in E:/OOTRemake/work/r18-logic/song-lessons): each lesson runs
# Dm_SY_Ocarina LearningOcarinaPlayExample, LearningOcarinaFollowExample (EventWaitOcarinaInputForLearning with
# EventPlayerPlayOcarinaFree: Link plays it himself) and LearningOcarinaPlayAuto(ForSeek) before its song step.
# The gift patch skips only the play-along's add step (03-game-data.md section 19), so a shuffled reward still
# waits for the lesson. Track G owns forced-scene safety; this keeps logic from relying on an unplayable lesson.
# Lessons with an existing override are guarded there: Sheik at Temple (sheik.toml), Song from Ocarina of Time
# (child_hyrule_field.toml), Song from Saria (child_sacred_forest_meadow.toml). Song from Malon's translated rule
# already needs a child Ocarina (lon_lon_ranch.toml:26). Events written only after a lesson match it: Met Child
# Zelda (child_hyrule_castle.toml) and Ice Cavern End Chest Access (adult_lake_hylia.toml). Rewards given before
# a lesson (HF Ocarina of Time Item, Dm_MelodyGet_Time Event70; Ice Cavern Iron Boots Chest) are not guarded.

