# Interim song-lesson rule (Round 18, Kareem via Main, 2026-11-18; revised 2026-11-20): every Dm_MelodyGet_*
# lesson needs an Ocarina, either instrument at either age (the Ocarina alias). Kareem's 2026-11-20 round-19
# Minuet control (adult, Fairy Ocarina only, main build) played the native lesson and granted its reward,
# and round 18's issue #34 adult-Fairy control played Sun's Song, so no lesson asks an adult for the Ocarina of
# Time. Generic song playing keeps its own instrument ages (age_ocarina.toml).
# Native (build e0f3ccfa, read-only trace in E:/OOTRemake/work/r18-logic/song-lessons): each lesson runs
# Dm_SY_Ocarina LearningOcarinaPlayExample, LearningOcarinaFollowExample (EventWaitOcarinaInputForLearning with
# EventPlayerPlayOcarinaFree: Link plays it himself) and LearningOcarinaPlayAuto(ForSeek) before its song step.
# The gift patch skips only the play-along's add step (03-game-data.md section 19), so a shuffled reward still
# waits for the lesson. Track G owns forced-scene safety; logic does not rely on the no-instrument path.
# Lessons with an existing override are guarded there: Sheik at Temple (sheik.toml), Song from Ocarina of Time
# (child_hyrule_field.toml), Song from Saria (child_sacred_forest_meadow.toml); dungeon_rewards.toml's completion
# copies of Song from Ocarina of Time and Sheik in Kakariko keep the same guard. The translated Song from Malon
# (lon_lon_ranch.toml:26) and Song from Windmill (kakariko.toml:207; Dm_MelodyGet_Storm first input Event36, then
# play-along Event6/Event9/Event13 before its song step Event29) rules already need an Ocarina. Events written only
# after a lesson match it: Met Child Zelda (child_hyrule_castle.toml) and Ice Cavern End Chest Access
# (adult_lake_hylia.toml). Rewards given before a lesson (HF Ocarina of Time Item, Dm_MelodyGet_Time Event70;
# Ice Cavern Iron Boots Chest) are not guarded.

