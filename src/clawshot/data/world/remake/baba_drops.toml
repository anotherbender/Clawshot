was = "is_adult or Kokiri_Sword or Boomerang"
source = "Round 22 cs22b, build e0f3ccfa; plans/rounds/r22-tracker.md: GameParameter/DropGlobalParam/Default.game__drop__DropGlobalParam.bgyml, DropLotteryMasterData.DropUnlockCondition gates Obj_DekuStick on Sequence_IsChildhood; ReplaceSetting targets it to Obj_Rupee_Green. Enemy_Dekubaba_DekuStickDrop DropSubTable names that actor with IsReplace=true. Kareem, Longshot 3.2.0, 0.2.6, 2026-11-24: sideways sword kill yields sticks; Bow/bombs yield nuts. Child Kokiri Sword retained; Boomerang yield unproven (Deku Tree.json:12). Tightening approved by Claude, 2026-11-24."

