[exits."Temple of Time"."Beyond Door of Time"]
rule = "(door_of_time == 'open' and 'Met Child Zelda') or (can_play(Song_of_Time) and ((door_of_time == 'song_only' and 'Met Child Zelda') or (has_all_stones and (Ocarina, 2) and 'Met Child Zelda')))"
was = "can_open_door_of_time"
source = "Kareem, 2026-11-16, round16 (r16-time.md), plus Claude's explicit both-early-modes confirmation: open and song_only wait for HavePlayedEvent.Dm_HrlField_0020, Impa's field send-off represented by Met Child Zelda; native clock advancement reads that history. Open needs no songs/stones; song_only needs learned Time song and either child ocarina, no stones. Closed retains sections41/46's courtyard/Impa, stones, Time ocarina/song requirements. Native escape and moat checks remain available after an early pull via guarded late-step predicates and forward-only quest writes. Forest return and Prelude remain separate."
