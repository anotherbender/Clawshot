# Round 15 (issue #30): what a shuffled Gold Skulltula (a ``Token`` check) may give. Clawshot data; no game
# resources. Read by clawshot.generate.tokens (fill admission) and clawshot.patch.tokens (writer).
#
# Admission is by native grant family, and each admitted member must pass the writer's structural check of its own
# dump row (clawshot.patch.tokens.grant_family over RSDB/PouchActorInfo, build e0f3ccfa) before any output; a
# family not listed here is not admitted. Admitted so far, each by played evidence (see [families]): Kareem's rc.3
# core, families-1 and route packets; then Claude, 2026-11-15, accepting packet2 (families-2), packet3
# (families-3) and packet3's short S1 Time-Ocarina second part, all PLAYED PASS on rc.3 (packet2's watcher newest
# used-reload 83/83; S1's reload 69/69), and ordering every packet2+3 family and Ocarina of Time admitted. Still
# excluded, as policy rather than pending packets:
# - bought goods (every ``Buy ...`` item: refills, ammo, Bombchus, bottle contents, Buy Heart, Buy Magic Jar) go
#   only to shop shelves in every seed, enforced by the fill (clawshot.generate.fill.SHOP_ONLY_PREFIX); no adapter
#   to a world pickup this round, so a ``NotPushToPouch`` shop bottle content never becomes a new bottle;
# - progressive copies and small keys stay chest-only; boss keys, maps and compasses stay in their own dungeon;
# - the Gerudo captain's card and trade items keep their existing holds; items outside every pool stay out;
# Both ocarinas and the twelve songs drop from the generated world actors Obj_Clawshot_Ocarina_* and
# Obj_Clawshot_Melody_* (clawshot.patch.tokens.GeneratedDonor), admitted after BBender's runs T1 and TB3
# (2026-11-24, plans/ocarina-song-drops-everywhere.md); songs go to Skulltulas only with songs = anywhere.
# - masks and other out-of-pool items remain excluded.
#
# [families]: family -> the played evidence that admits it.
# [rewards."<logic item>"]: actor = the native actor whose grant the Token check delivers (a native world
# pickup, Obj_*, where one exists; an Item_ bundle row where that row is itself the native grant; and once the
# chest-content row TBox_DekuNutBundle, the only native bundle behind the ``Deku Nuts (5)`` label; never a shop
# display Shop_*), family, source = that actor's PouchActorInfo grant fields as read from the dump.

