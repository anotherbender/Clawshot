# Round 15 (issue #30): what a shuffled Gold Skulltula (a ``Token`` check) may give. Clawshot data; no game
# resources. Read by clawshot.generate.tokens (fill admission) and clawshot.patch.tokens (writer).
#
# Claude, 2026-11-14, after Kareem's PLAYED core, families-1 and route packets: admission is by native grant family,
# and each admitted member must pass the writer's structural check of its own dump row
# (clawshot.patch.tokens.grant_family over RSDB/PouchActorInfo, build e0f3ccfa) before any output.
# A family not listed here is not admitted. Claude's approved Round 15 family table (2026-11-14):
# - bought goods (every ``Buy ...`` item: refills, ammo, Bombchus, bottle contents, Buy Heart, Buy Magic Jar) go
#   only to shop shelves in every seed, enforced by the fill (clawshot.generate.fill.SHOP_ONLY_PREFIX); no adapter
#   to a world pickup this round, so a ``NotPushToPouch`` shop bottle content never becomes a new bottle;
# - progressive copies and small keys stay chest-only; boss keys, maps and compasses stay in their own dungeon;
#   songs, the Gerudo captain's card and trade items keep their existing holds; items outside every pool stay out;
# - ocarinas are excluded unless a later small packet proves them;
# - families-1 admits new bottles, ordinary rupees, Heart Pieces/Containers and fixed nut/stick capacity;
# - Bombchus remain excluded: the no-bag diagnostic completed but gave 0/0, pending the with-bag +5 packet;
# - gold rupees, ordinary ammo, magic recovery/spells/arrows, Lens and Echo Gem await packets2/3;
#   masks and other out-of-pool items remain excluded.
#
# [families]: family -> the played evidence that admits it.
# [rewards."<logic item>"]: actor = the native actor whose grant the Token check delivers (a native world
# pickup, Obj_*, where one exists; never a chest wrapper TBox_* or shop display Shop_*), family, source = that
# actor's PouchActorInfo grant fields as read from the dump.

[families]
token = "Kareem, rc.3 core packet PASS: HF GS Lone Tree native token (count 9 -> 10, its own source pair set) and a token in KF Storms Grotto Chest (count 10 -> 11, only that chest's flag); House 10 paid once from chest + source tokens"
fixed_major = "Kareem, rc.3 core packet PASS: Boomerang at LLR GS Tree, recovered after leaving and after Save and Continue, then usable; no token added"
equipment = "Kareem, rc.3 core packet PASS: Hylian Shield (Obj_Shield_Hylian) at LLR GS Tower, retrieved with the Boomerang and equipped; no token added"
bottle = "Kareem, rc.3 families-1: new Milk bottle and source committed; drank to Empty, original bottle unchanged, final saved checker matched"
rupee = "Kareem, rc.3 families-1: Obj_Rupee_Red from Field lone tree, rupees 68 -> 88, source pair set and token count unchanged"
heart_piece = "Kareem, rc.3 families-1: first Heart Piece, stock1 with MaxLife unchanged, source committed; abandoned drop recovered"
heart_container = "Kareem, rc.3 families-1: whole container raises MaxLife16 -> 20 with Piece stock unchanged, source committed"
fixed_capacity = "Kareem, rc.3 families-1: Item_NutBag_Medium establishes native30 capacity/refill and source completion; fixed StickBag member retains its own native20 fields"

