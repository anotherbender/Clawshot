# Bottles follow has_bottle (D18; world/rules.py): each owned slot without the letter is one `bottle`; a slot holding
# Ruto's Letter is one `letter`, never also a bottle. The letter also counts once its acquired-once flag is set (D2:
# IsGet.<letter_actor>, a BOTTLE_ACTORS row of state.py).
[bottles]
bottle = "Bottle"
letter = "Rutos Letter"
letter_actor = "Item_Bottle_Letter"

# Heart rules count pieces: Piece of Heart // 4 + 3 >= hearts (world/rules.py). The save's whole hearts
# (state.hearts "containers") beyond the starting three are four pieces each; loose pieces are not counted, since
# whether the saved piece count is the remainder or all found is not established (state.hearts).
[hearts]
item = "Piece of Heart"
pieces_per_heart = 4
starting_hearts = 3

# The native token stock (state "tokens").
[tokens]
item = "Gold Skulltula Token"

# Per world dungeon (seeds.DUNGEON_INFO): small keys are the found count, spent keys included (D3); the others
# their saved flags. Names the world does not have (a Map's, a hideout boss key) are skipped.
[dungeon_items]
small_key = "Small Key ({dungeon})"
boss_key = "Boss Key ({dungeon})"
map = "Map ({dungeon})"
compass = "Compass ({dungeon})"

# Story steps the logic names that the save records (D17): a held flag counts as the event.
[story."Field Owl Arrival"]
flag = "HyruleField_ArriveEntrance"
source = "data/world/remake/child_hyrule_castle.toml, event Time Flows: 'Field Owl Arrival' is saved HyruleField_ArriveEntrance (round16 clock predicate, work/r16-time/clock-full-predicate-findings.md); child_hyrule_field.toml: monotone, no event clears it."

[story."Met Child Zelda"]
flag = "HavePlayedEvent.Dm_HrlField_0020"
source = "data/world/remake/child_hyrule_castle.toml, event Time Flows: 'Met Child Zelda' is HavePlayedEvent.Dm_HrlField_0020, Impa's send-off (round16 clock predicate); patch/door.py SENDOFF."

# A gift the save records only as its cutscene's saved Bool: the flag counts as the item. `vanilla_at`: only while that
# location keeps its vanilla item; shuffled, the flag would mean the check was done, not that the item is held.
# Seed child logic reads 'Goron Bracelet' from Darunia's gift only, never from a strength copy (world.toml
# [helpers.Progressive_Strength_Upgrade]; rounds/r14-progressive.md), so the strength cell, whose copies and adult
# gauntlets are Progressive Strength, never grants it.
[story."Goron Bracelet"]
flag = "HavePlayedEvent.Dm_Goron_0030"
vanilla_at = "GC Darunias Joy"
source = "patch/darunia.py SOURCE: native saved Bool (progress.sav, default false, reset type 8) written right after the gift's Event127 in Dm_Goron_0030, in every seed (patch/__init__.py); plans/03-game-data.md, Darunia correction: Kareem via Claude (2026-11-14) confirmed the flag in game. Event127's wrapper writes it even when it skips a redundant Bracelet grant, as seed logic credits Darunia's source. Read from real saves by the tracker: cs21g, round 21 (plans/rounds/r21-checks.md, receipt work/r21-checks/darunia-tracker-result.json): Kareem's game-written Longshot before/after pair of 2026-11-13 reads flag false, row not collected, Bracelet 0, then flag true, row collected, Bracelet 1; unchanged with PR #39 (cs21b, plans/rounds/r21-pr39.md)."

# Consumables the save holds as a stock (PouchData.<actor>.StockNum). One held grants `item`, the name the logic
# helper reads (data/world/helpers.toml: Sticks = Buy_Deku_Stick_1 or ..., Nuts = Buy_Deku_Nut_5 or ...); a bought
# stick leaves no other record. Held now only: a new game sets IsGet.Item_DekuNut with no nut held (seen in the saves
# of seed 212067047, BBender's play on Longshot 3.0.0, 2026-11-20), so the acquired-once flag is not having them. `label` names the
# stock in unknown_items when the save lacks it.
[stock.Item_DekuStick]
item = "Buy Deku Stick (1)"
label = "Deku Sticks"

[stock.Item_DekuNut]
item = "Buy Deku Nut (5)"
label = "Deku Nuts"

