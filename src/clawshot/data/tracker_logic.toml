tiers = [{}, { "Progressive Wallet" = 1 }, { "Progressive Wallet" = 2 }]

[cells.bomb_bag]
tiers = [{ "Progressive Bomb Bag" = 1 }, { "Progressive Bomb Bag" = 2 }, { "Progressive Bomb Bag" = 3 }]

# Bow and Slingshot are the chains' first tiers; the Small quiver/bullet bag comes with them.
[cells.bow]
item = "Progressive Quiver"

[cells.quiver]
tiers = [{}, { "Progressive Quiver" = 2 }, { "Progressive Quiver" = 3 }]
requires = "bow"

[cells.slingshot]
