# Silver rupee puzzles (round 22, cs22b). The remake places 85 Obj_RupeeToken_Silver in 17 puzzles of five
# (plans/03-game-data.md section 5); each puzzle's Banc AiGroup binds its five rupees, an Obj_silverRupeeCounter whose
# Links name exactly those five, and the room's logic module. The save keeps no rupee count: what it keeps is the
# room's clear, one Bool per puzzle (`flag`), which counts as the world's whole group (`count`, the group's
# SilverRupee locations; every rule reads 5). A puzzle not cleared counts none, however many rupees were taken (D4):
# the rupees' own Bool64bitKey actor flags (reset type 24) are not an audited pick-up contract (03-game-data.md
# section 6). Every flag below is a GameDataList Bool (GameData/GameDataList.Product.110.byml.zs, build e0f3ccfa)
# with DefaultValue false, ResetTypeValue 8, SaveFileIndex 0: saved to slot_NN/progress.sav and not reset on an
# area change (ootmenu findings, sloperinaGZ docs/FINDINGS.md section 1 "Saved or not": reset bits 0x08 with save
# index 0 are progress; bit 0 is the area-change reset). Its writer is the room module's TriggerGameDataSetBoolTrue,
# driven by the puzzle counter's AllGet output (directly, through the Obj_SilverToken group module's outputs, or
# through the unlock event the counter requests); the module reads the Bool back to keep the puzzle cleared. No
# other live writer (one unconnected node, Bottom of the Well's source) and no TriggerGameDataSetBoolFalse names any
# of them in any AINB graph (round 14's decode cache, 5036 graphs), event flow (915) or Banc file. Rooms are
# DefaultDungeonRoomIndex. Receipt (read-only dump, facts only):
# E:/OOTRemake/work/r22-tracker/silver/audit_silver.py and audit.json. Not mapped: the GTG lava room (see
# [unmapped]), and the six groups no remake puzzle and no world location has.
