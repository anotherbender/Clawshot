# The tracker's save-read cells -> the logic item names a seed's search counts (spec tracker-in-logic, D1-D4, D17,
# D18; read by clawshot.tracker.logic). Cell ids are clawshot.tracker.state's. What each cell reads from the save,
# and the evidence for it, is documented there; this file only says what a held cell is worth to the logic.
#
# A seed's world counts only progressive copies toward the native chains (world.toml [native_progressive],
# `copies_only`), so tier cells grant copies of the chain item (clawshot.progressive.CHAINS): a held Longshot is two
# Progressive Hookshot. Per logic item, the inventory takes the largest grant of any cell, never a sum.
#
# [cells.<id>] keys:
#   item      one copy while the cell is held (songs: once learned).
#   count     with `item`: as many copies as the cell's count (its stock).
#   tiers     a tier cell's grants per held tier, lowest first: the highest held tier's table counts.
#   acquired  D2: each grant also counts once the save's acquired-once flag (IsGet.<pouch name>, plans/03-game-data.md
#             section 19) is set, even when the item has left the inventory (traded, sold, eaten, burnt). For a tier
#             cell, every tier counts on its own (held now, or its own IsGet), not only the highest.
#   requires  counts only while that other cell is held (a capacity upgrade is not the weapon, CHAINS' comment).

# --- Upgrades and progressive chains (clawshot.progressive.CHAINS; owned pouch names = state.TIERS actors).
[cells.hookshot]
tiers = [{ "Progressive Hookshot" = 1 }, { "Progressive Hookshot" = 2 }]

[cells.strength]
tiers = [{ "Progressive Strength" = 1 }, { "Progressive Strength" = 2 }, { "Progressive Strength" = 3 }]

[cells.scale]
tiers = [{ "Progressive Scale" = 1 }, { "Progressive Scale" = 2 }]

# The small (200) wallet is starting equipment, not a chain tier (CHAINS: "Progressive Wallet").
