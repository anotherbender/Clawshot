flag = "BottomOfTheWell_Level_Room_09_A_SilverRupee_GetAll"
count = 5
source = "Banc BottomOfTheWell room 9, the dungeon's only puzzle (AiGroup 2607688059532569446, counter 16625183292448018016). Logic/BottomOfTheWell_Level_Room_10_Prefab_e580.logic.module.ainb n18 TriggerGameDataSetBoolTrue <- n2 EventRequestActor (BottomOfTheWell_SilverToken_Unlock) EventFinish, requested by n10 ActorLogicRupeeCounter AllGet; n19 reads it back (counter Vanish, event actor Logic_Delete). Room_10_Prefab_cb30 n4 also names it, with IsDrive unconnected (default false): it never fires. GameDataList Bool 0x74b2b996."

